[package]
name = "rdt-ssh"
description = "SSH client: host key verification, authentication, PTY sessions, SFTP"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
rdt-types.workspace = true
rdt-platform.workspace = true
rdt-terminal.workspace = true

russh.workspace = true
russh-sftp.workspace = true

tokio = { workspace = true, features = ["net", "io-util", "time", "process", "macros"] }
futures.workspace = true
bytes.workspace = true
base64.workspace = true
sha2.workspace = true
sha1 = "0.10"
hmac = "0.12"
subtle.workspace = true
parking_lot.workspace = true
tracing.workspace = true
async-trait = "0.1"

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
russh = { workspace = true, features = ["server"] }
tokio = { workspace = true, features = ["rt-multi-thread", "io-std"] }

[lints]
workspace = true
